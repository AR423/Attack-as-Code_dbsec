name: Plan and Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plan-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [weak, hardened]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Terraform Init
        working-directory: terraform/${{ matrix.config }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/${{ matrix.config }}
        env:
          TF_VAR_master_password: ${{ matrix.config == 'weak' && secrets.WEAK_DB_PASSWORD || secrets.HARDENED_DB_PASSWORD }}
        run: terraform plan

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov -d terraform/${{ matrix.config }} --compact --output cli --output junitxml --output-file-path console,checkov-${{ matrix.config }}.xml
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        with:
          name: checkov-${{ matrix.config }}
          path: checkov-${{ matrix.config }}.xml