name: Deploy, Attack, Destroy

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Which config to deploy and attack"
        required: true
        type: choice
        options:
          - weak
          - hardened

jobs:
  deploy-attack-destroy:
    runs-on: ubuntu-latest
    env:
      CONFIG: ${{ github.event.inputs.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Set DB password env var
        env:
          WEAK_PW: ${{ secrets.WEAK_DB_PASSWORD }}
          HARDENED_PW: ${{ secrets.HARDENED_DB_PASSWORD }}
        run: |
          if [ "$CONFIG" = "weak" ]; then
            echo "TF_VAR_master_password=$WEAK_PW" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_master_password=$HARDENED_PW" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        working-directory: terraform/${{ env.CONFIG }}
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/${{ env.CONFIG }}
        run: terraform apply -auto-approve

      - name: Get DB endpoint
        working-directory: terraform/${{ env.CONFIG }}
        run: echo "DB_ENDPOINT=$(terraform output -raw db_endpoint)" >> $GITHUB_ENV

      - name: Install attack tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap hydra
        
      - name: Prepare results directory
        run: mkdir -p attack-stage/results

      - name: Port/service scan
        run: ./attack-stage/port_scan.sh "${DB_ENDPOINT%%:*}"
        continue-on-error: true

      - name: Credential guessing
        run: ./attack-stage/credential_guess.sh "${DB_ENDPOINT%%:*}" dbadmin
        continue-on-error: true

      - name: Snapshot exposure check
        run: python3 attack-stage/snapshot_exposure_check.py dbsec-$CONFIG | tee attack-stage/results/snapshot_exposure_result.txt
        continue-on-error: true

      - name: IAM permission abuse check
        run: python3 attack-stage/iam_abuse_check.py dbsec-$CONFIG-rds-role | tee attack-stage/results/iam_abuse_result.txt
        continue-on-error: true

      - name: Upload attack-stage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-results-${{ env.CONFIG }}
          path: attack-stage/results/

      - name: Terraform Destroy
        if: always()
        working-directory: terraform/${{ env.CONFIG }}
        run: terraform destroy -auto-approve